<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读片研究</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    margin: 0;
    padding: 36px 20px 120px;
    line-height: 1.5;
    font-size: 14px;
  }

  .container { max-width: 1400px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }

  .reader-info {
    display: flex; gap: 20px; flex-wrap: wrap;
    padding: 14px 18px; background: white;
    border: 1px solid #e5e5e5; border-radius: 8px;
    margin-bottom: 20px;
  }
  .reader-info label { font-size: 13px; color: #444; display: flex; align-items: center; gap: 8px; }
  .reader-info input {
    padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;
    font-size: 13px; font-family: inherit;
  }
  .reader-info input[type="text"] { width: 180px; }

  .case-card {
    background: white; border: 1px solid #e5e5e5; border-radius: 8px;
    padding: 18px 20px; margin-bottom: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .case-card.completed {
    border-color: #c9dcca; background: #fbfdfb;
  }

  .case-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .case-title { font-size: 15px; font-weight: 600; }
  .status-badge { font-size: 12px; color: #999; }
  .status-badge.done { color: #3d9942; }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: #888; margin: 10px 0 6px;
  }

  .diagnosis-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px;
  }
  .radio-option {
    display: flex; align-items: center; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; font-size: 13.5px;
    border: 1px solid transparent; transition: background 0.1s;
  }
  .radio-option:hover { background: #f3f3f0; }
  .radio-option input { margin-right: 8px; cursor: pointer; }
  .radio-option:has(input:checked) {
    background: #eef3fa; border-color: #b9cce5;
  }

  .confidence-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .confidence-option {
    text-align: center; padding: 8px 4px;
    border: 1px solid #ddd; border-radius: 4px;
    cursor: pointer; transition: all 0.1s;
  }
  .confidence-option:hover { border-color: #bbb; background: #f8f8f6; }
  .confidence-option input { display: none; }
  .confidence-option:has(input:checked) {
    background: #eef3fa; border-color: #6b9bd5; color: #1a4e8a;
  }
  .confidence-num { display: block; font-size: 15px; font-weight: 600; }
  .confidence-lbl { display: block; font-size: 11px; color: #666; margin-top: 2px; }
  .confidence-option:has(input:checked) .confidence-lbl { color: #1a4e8a; }

  /* 提交状态提示 */
  .submit-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.85);
    z-index: 1000;
    justify-content: center; align-items: center;
    flex-direction: column; gap: 12px;
  }
  .submit-overlay.active { display: flex; }
  .submit-overlay .spinner {
    width: 36px; height: 36px;
    border: 3px solid #e5e5e5; border-top-color: #3d9942;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .submit-overlay .msg { font-size: 15px; color: #444; }

  /* 成功/失败提示 */
  .result-banner {
    display: none;
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .result-banner.success {
    display: block;
    background: #ecf7ed; border: 1px solid #b8deba; color: #1e6f23;
  }
  .result-banner.error {
    display: block;
    background: #fdf0f0; border: 1px solid #e5c0c0; color: #a33;
  }

  /* 双栏图片容器 */
  .dual-viewer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .image-viewer {
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    overflow: hidden;
    background: #fafafa;
  }
  .viewer-img-area {
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .viewer-img-area img {
    height: 100%;
    width: 100%;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
  }
  .viewer-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px;
    background: #f0f0ee;
    font-size: 13px;
    color: #555;
  }
  .viewer-nav button {
    padding: 2px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: white;
    cursor: pointer;
  }
  .viewer-nav button:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .viewer-nav input[type="number"] {
    width: 44px;
    padding: 2px 4px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    text-align: center;
    font-family: inherit;
    -moz-appearance: textfield;
  }
  .viewer-nav input[type="number"]::-webkit-outer-spin-button,
  .viewer-nav input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
  }
  .loading-placeholder {
    padding: 40px;
    text-align: center;
    color: #999;
    font-size: 13px;
  }

  /* 点击放大 */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 2000;
    cursor: zoom-out;
    justify-content: center;
    align-items: center;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
  }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid #e5e5e5;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
    z-index: 100;
  }
  .footer-inner {
    max-width: 1400px; margin: 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
  }
  .progress-info { font-size: 13px; color: #555; }
  .progress-bar {
    width: 220px; height: 5px; background: #eee; border-radius: 3px;
    margin-top: 5px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #3d9942; transition: width 0.2s; }

  .actions { display: flex; gap: 8px; }
  button {
    padding: 7px 14px; border-radius: 5px; border: 1px solid #ccc;
    background: white; font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all 0.1s;
  }
  button:hover { background: #f5f5f3; }
  button.primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  button.primary:disabled { background: #999; border-color: #999; cursor: not-allowed; }
  button.secondary { color: #555; border-color: #ccc; }

  @media (max-width: 900px) {
    .dual-viewer { grid-template-columns: 1fr; }
    .diagnosis-grid { grid-template-columns: 1fr; }
    .footer-inner { flex-direction: column; gap: 8px; align-items: stretch; }
    .progress-bar { width: 100%; }
    .actions { justify-content: flex-end; }
  }

  /* 访问密码锁 */
  .lock-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1a1a;
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }
  .lock-overlay.hidden { display: none; }
  .lock-box {
    background: white;
    border-radius: 10px;
    padding: 32px 28px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .lock-box h2 { font-size: 16px; margin: 0 0 16px; }
  .lock-box input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 12px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .lock-box button {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    background: #1a1a1a;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .lock-box button:hover { background: #333; }
  .lock-error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }
  .retry-box { padding: 40px 20px; text-align: center; color: #a33; font-size: 14px; }
  .retry-box button { margin-top: 12px; }
</style>
</head>
<body>

<!-- 访问密码锁 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <h2>请输入访问密码</h2>
    <input type="password" id="lockPasswordInput" placeholder="密码" autocomplete="off">
    <button onclick="tryUnlock()">进入</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- 提交中的遮罩层 -->
<div class="submit-overlay" id="submitOverlay">
  <div class="spinner"></div>
  <div class="msg" id="overlayMsg">正在提交答案…</div>
</div>

<div class="container">
  <header>
    <h1 id="pageTitle">读片研究</h1>
    <div class="subtitle" id="pageSubtitle"></div>
    <div class="result-banner" id="resultBanner"></div>
    <div class="reader-info">
      <label>读者编号 <input type="text" id="readerId" placeholder="例如 R01"></label>
      <label>日期 <input type="date" id="studyDate"></label>
    </div>
  </header>
  <div id="caseContainer"></div>
</div>

<footer>
  <div class="footer-inner">
    <div>
      <div class="progress-info"><span id="progressText">0 / 0</span> 已完成</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="downloadBackup()" title="下载本地JSON备份">备份</button>
      <button class="primary" id="submitBtn" onclick="finish()">提交</button>
    </div>
  </div>
</footer>

<script>



  // 图片桶地址。图片和清单都在桶里的 upload 文件夹内：
  //   upload/image-manifest.json
  //   upload/images/caseN/caseN.k.jpg

  const IMAGE_BASE = 'https://new-reader-photos-1469079903.cos.ap-guangzhou.myqcloud.com/upload';

  // 答案提交桶地址，答案会写到这个桶的 submissions/ 目录下。
  const COS_SUBMIT_BASE = 'https://alternate-submission-1469079903.cos.ap-guangzhou.myqcloud.com';

  // 图片版本号。换一批新图片时改成 'v2'、'v3'……
  // 它会写进每份提交的数据里，并且让浏览器里的草稿也分开存放，避免新旧题目的答案混在一起。
  const IMAGE_VERSION = 'v1';

  const STUDY_TITLE = '读片研究';

  
  const LOCK_HASH = 'cdb770bfbd52b71d4949ddddc426abf95892c82f823f3628feea41e0511f31f0';

  const MANIFEST_URL = IMAGE_BASE + '/image-manifest.json';

  // 题目列表：不再写死，打开页面后根据清单自动生成
  let CASE_IDS = [];          // 例如 ['case1','case2',...]，按数字排序
  let MANIFEST_HASH = '';     // 清单内容的指纹，写进提交数据，方便核对用的是哪一版清单

  const DIAGNOSES = [
    { value: 'agenesis_of_the_corpus_callosum',        label: '胼胝体发育不全' },
    { value: 'aqueductal_stenosis',                    label: '中脑导水管狭窄' },
    { value: 'cephalocele',                            label: '脑膨出' },
    { value: 'chiari_II_malformation',                 label: 'Chiari II 畸形' },
    { value: 'dandy_walker_malformation',              label: 'Dandy-Walker 畸形' },
    { value: 'hemorrhage',                             label: '脑出血' },
    { value: 'holoprosencephaly',                      label: '全前脑畸形' },
    { value: 'isolated_ventriculomegaly_mild_moderate', label: '单纯性脑室增宽（轻度或中度）' },
    { value: 'isolated_ventriculomegaly_severe',       label: '单纯性脑室增宽（重度）' },
    { value: 'normal',                                 label: '正常' },
  ];

  const CONFIDENCE_LEVELS = [
    { value: 1, label: '非常不确定' },
    { value: 2, label: '不确定' },
    { value: 3, label: '一般' },
    { value: 4, label: '确定' },
    { value: 5, label: '非常确定' },
  ];

  const STORAGE_KEY = `reader_study_v4_${IMAGE_VERSION}`;
  let hasSubmitted = false;
  let storageBroken = false;   // 本地存储是否失效
  let autoSubmitTimer = null;  // 自动云端保存的防抖计时器
  let autoSaveFailCount = 0;

  // ---------- 小工具 ----------
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function randomHex(nBytes) {
    try {
      const a = new Uint8Array(nBytes);
      crypto.getRandomValues(a);
      return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      let s = '';
      for (let i = 0; i < nBytes * 2; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s;
    }
  }

  // 本次浏览器的随机编号：同一个浏览器里草稿始终写同一个文件，换设备则是另一个文件
  function getSessionId() {
    try {
      let s = localStorage.getItem(STORAGE_KEY + '_sid');
      if (!s) { s = randomHex(4); localStorage.setItem(STORAGE_KEY + '_sid', s); }
      return s;
    } catch (e) {
      if (!window._sid) window._sid = randomHex(4);
      return window._sid;
    }
  }

  function safeReaderName() {
    return (state.readerId || '').trim().replace(/[^\w一-龥-]/g, '_').slice(0, 40) || 'unknown';
  }

  function caseNum(caseId) { return parseInt(caseId.replace('case', ''), 10); }

  // 带超时的 fetch：超过指定毫秒没有响应就主动判定为失败
  function fetchWithTimeout(url, options, timeoutMs = 11000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...options, signal: controller.signal })
      .finally(() => clearTimeout(timer));
  }

  // ---------- 访问密码锁 ----------
  function unlockUI() {
    document.getElementById('lockOverlay').classList.add('hidden');
    init(); // 密码通过后才开始加载清单和图片
  }

  async function tryUnlock() {
    const input = document.getElementById('lockPasswordInput').value;
    const hash = await sha256(input);
    if (hash === LOCK_HASH) {
      try { sessionStorage.setItem('reader_study_unlocked', '1'); } catch (e) {}
      unlockUI();
    } else {
      document.getElementById('lockError').textContent = '密码错误，请重试。';
    }
  }

  document.getElementById('lockPasswordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });

  // ---------- 本地自动保存（localStorage + sessionStorage 双重备份）----------
  function loadState() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return JSON.parse(s);
    } catch (e) {}
    try {
      const s = sessionStorage.getItem(STORAGE_KEY);
      if (s) return JSON.parse(s);
    } catch (e) {}
    return { readerId: '', studyDate: '', answers: {} };
  }

  function saveState() {
    const json = JSON.stringify(state);
    let localOk = false, sessionOk = false;
    try { localStorage.setItem(STORAGE_KEY, json); localOk = true; } catch (e) {}
    try { sessionStorage.setItem(STORAGE_KEY, json); sessionOk = true; } catch (e) {}

    if (!localOk && !sessionOk && !storageBroken) {
      storageBroken = true;
      showBanner('error',
        '⚠ 检测到此浏览器无法保存草稿，请勿关闭或刷新此页面！' +
        '系统将尝试每次作答后自动上传到云端保存，但强烈建议尽快填完并点击"提交"。'
      );
    }
    scheduleAutoCloudSave();
  }

  // ---------- 云端自动保存（腾讯云）：作答后停顿 10 秒再悄悄上传一次进度 ----------
  function scheduleAutoCloudSave() {
    if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
    autoSubmitTimer = setTimeout(autoCloudSave, 10000);
  }

  async function autoCloudSave() {
    // 还没填读者编号之前不上传，避免产生匿名垃圾文件
    if (!state.readerId || !state.readerId.trim()) return;
    if (!CASE_IDS.length) return;
    const hasAnyAnswer = Object.values(state.answers).some(a => a && (a.diagnosis || a.confidence));
    if (!hasAnyAnswer) return;

    const data = buildSubmitData();
    data.status = 'in_progress';
    // 草稿文件名固定（同一浏览器反复覆盖同一个文件），正式提交则每次生成新文件
    const name = `_draft_${safeReaderName()}_${getSessionId()}.json`;
    const url = COS_SUBMIT_BASE + '/submissions/' + encodeURIComponent(name);

    try {
      const res = await fetchWithTimeout(url, {
        method: 'PUT',
        keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data, null, 2),
      }, 11000);
      if (!res.ok) throw new Error('COS HTTP ' + res.status);
      autoSaveFailCount = 0;
    } catch (err) {
      console.error('云端自动保存失败:', err);
      handleAutoSaveFailure();
    }
  }

  function handleAutoSaveFailure() {
    autoSaveFailCount++;
    // 连续失败 2 次以上才提醒，避免偶尔一次网络抖动吓到人
    if (autoSaveFailCount >= 2) {
      showBanner('error',
        '⚠ 云端自动保存已连续失败 ' + autoSaveFailCount + ' 次，可能是网络不稳定。' +
        '系统会继续自动重试，但建议尽快填完并点击"提交"按钮，或先下载一份本地备份。',
        false
      );
    }
    // 15 秒后自动重试，不用等医生再做新操作
    if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
    autoSubmitTimer = setTimeout(autoCloudSave, 15000);
  }

  // 切换到别的应用（例如微信里切走）时，马上保存一次
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !hasSubmitted) {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      autoCloudSave();
    }
  });

  let state = loadState();
  if (!state.answers) state.answers = {};

  // ---------- 读者信息栏 ----------
  document.title = STUDY_TITLE;
  document.getElementById('pageTitle').textContent = STUDY_TITLE;

  const readerIdEl = document.getElementById('readerId');
  const studyDateEl = document.getElementById('studyDate');
  readerIdEl.value = state.readerId || '';
  studyDateEl.value = state.studyDate || new Date().toISOString().slice(0, 10);
  if (!state.studyDate) { state.studyDate = studyDateEl.value; saveState(); }
  readerIdEl.addEventListener('input', e => { state.readerId = e.target.value; saveState(); });
  studyDateEl.addEventListener('input', e => { state.studyDate = e.target.value; saveState(); });

  // ---------- 初始化：读取清单 → 自动生成题目 ----------
  const container = document.getElementById('caseContainer');

  async function init() {
    container.innerHTML = '<div class="loading-placeholder">正在加载题目清单…</div>';
    try {
      const res = await fetchWithTimeout(MANIFEST_URL, { cache: 'no-cache' }, 15000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const map = JSON.parse(text);

      const ids = Object.keys(map)
        .filter(k => /^case\d+$/.test(k))
        .sort((a, b) => caseNum(a) - caseNum(b));
      if (ids.length === 0) throw new Error('清单里没有任何病例');

      try { MANIFEST_HASH = (await sha256(text)).slice(0, 12); } catch (e) { MANIFEST_HASH = ''; }

      window._imageMap = map;
      CASE_IDS = ids;
      buildPage();
    } catch (err) {
      console.error('题目清单加载失败：', err);
      container.innerHTML =
        '<div class="retry-box">题目清单加载失败，可能是网络不稳定。<br>' +
        '<button onclick="init()">重新加载</button></div>';
    }
  }

  function buildPage() {
    const total = CASE_IDS.length;
    document.getElementById('pageSubtitle').textContent =
      `共 ${total} 个病例。请为每个病例选择主要诊断和信心等级。` +
      `您的答案已自动保存在浏览器中，完成后点击"提交"。`;

    container.innerHTML = '';
    CASE_IDS.forEach(caseId => {
      const n = caseNum(caseId);
      const card = document.createElement('div');
      card.className = 'case-card';
      card.id = `card-${caseId}`;
      const existing = state.answers[caseId] || {};

      const diagnosisHTML = DIAGNOSES.map(d => `
        <label class="radio-option">
          <input type="radio" name="dx-${caseId}" value="${d.value}" ${existing.diagnosis === d.value ? 'checked' : ''}>
          <span>${d.label}</span>
        </label>`).join('');

      const confidenceHTML = CONFIDENCE_LEVELS.map(c => `
        <label class="confidence-option" title="${c.label}">
          <input type="radio" name="conf-${caseId}" value="${c.value}" ${existing.confidence == c.value ? 'checked' : ''}>
          <span class="confidence-num">${c.value}</span>
          <span class="confidence-lbl">${c.label}</span>
        </label>`).join('');

      card.innerHTML = `
        <div class="case-header">
          <div class="case-title">病例 ${n}</div>
          <div class="status-badge" id="status-${caseId}"></div>
        </div>
        <div class="dual-viewer">
          <div class="image-viewer">
            <div class="viewer-img-area" id="imgarea-${caseId}-a">
              <div class="loading-placeholder">加载中…</div>
            </div>
            <div class="viewer-nav" id="viewnav-${caseId}-a" style="display:none"></div>
          </div>
          <div class="image-viewer">
            <div class="viewer-img-area" id="imgarea-${caseId}-b">
              <div class="loading-placeholder">加载中…</div>
            </div>
            <div class="viewer-nav" id="viewnav-${caseId}-b" style="display:none"></div>
          </div>
        </div>
        <div class="section-label">诊断</div>
        <div class="diagnosis-grid">${diagnosisHTML}</div>
        <div class="section-label">信心等级</div>
        <div class="confidence-row">${confidenceHTML}</div>`;

      container.appendChild(card);

      card.querySelectorAll(`input[name="dx-${caseId}"]`).forEach(r =>
        r.addEventListener('change', e => updateAnswer(caseId, 'diagnosis', e.target.value))
      );
      card.querySelectorAll(`input[name="conf-${caseId}"]`).forEach(r =>
        r.addEventListener('change', e => updateAnswer(caseId, 'confidence', parseInt(e.target.value)))
      );
      updateCardStatus(caseId);

      const fileList = window._imageMap[caseId] || [];
      renderImage(caseId, 'a', fileList, 0);
      renderImage(caseId, 'b', fileList, Math.min(1, Math.max(0, fileList.length - 1)));
    });
    updateProgress();
  }

  function updateAnswer(caseId, field, value) {
    if (!state.answers[caseId]) state.answers[caseId] = {};
    state.answers[caseId][field] = value;
    saveState();
    updateCardStatus(caseId);
    updateProgress();
  }

  function updateCardStatus(caseId) {
    const ans = state.answers[caseId] || {};
    const card = document.getElementById(`card-${caseId}`);
    const badge = document.getElementById(`status-${caseId}`);
    if (!card || !badge) return;
    const complete = ans.diagnosis && ans.confidence;
    if (complete) {
      card.classList.add('completed');
      badge.classList.add('done');
      badge.textContent = '✓ 已完成';
    } else {
      card.classList.remove('completed');
      badge.classList.remove('done');
      const parts = [];
      if (!ans.diagnosis) parts.push('诊断');
      if (!ans.confidence) parts.push('信心等级');
      badge.textContent = parts.length ? `缺少：${parts.join('、')}` : '';
    }
  }

  function updateProgress() {
    const total = CASE_IDS.length;
    let completed = 0;
    CASE_IDS.forEach(caseId => {
      const a = state.answers[caseId] || {};
      if (a.diagnosis && a.confidence) completed++;
    });
    document.getElementById('progressText').textContent = `${completed} / ${total}`;
    document.getElementById('progressFill').style.width =
      total ? `${(completed / total * 100).toFixed(1)}%` : '0%';
  }

  // ---------- 提交 ----------
  function getIncompleteCases() {
    const incomplete = [];
    CASE_IDS.forEach(caseId => {
      const a = state.answers[caseId] || {};
      if (!a.diagnosis || !a.confidence) {
        const missing = [];
        if (!a.diagnosis) missing.push('诊断');
        if (!a.confidence) missing.push('信心等级');
        incomplete.push({ caseId, num: caseNum(caseId), missing: missing.join('、') });
      }
    });
    return incomplete;
  }

  function buildSubmitData() {
    const data = {
      reader_id: state.readerId,
      study_date: state.studyDate,
      image_version: IMAGE_VERSION,
      manifest_hash: MANIFEST_HASH,
      submitted_at: new Date().toISOString(),
      total_cases: CASE_IDS.length,
      user_agent: navigator.userAgent,
      answers: {}
    };
    CASE_IDS.forEach(caseId => {
      const a = state.answers[caseId] || {};
      data.answers[caseId] = {
        diagnosis: a.diagnosis || null,
        confidence: a.confidence || null
      };
    });
    return data;
  }

  // 向腾讯云写入正式提交文件，失败时最多重试 3 次
  async function putFinal(url, body) {
    let lastErr;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const res = await fetchWithTimeout(url, {
          method: 'PUT',
          keepalive: true,
          headers: { 'Content-Type': 'application/json' },
          body: body,
        }, 15000);
        if (res.ok) return true;
        lastErr = new Error('COS HTTP ' + res.status);
      } catch (e) {
        lastErr = e;
      }
      await new Promise(r => setTimeout(r, 1500 * attempt));
    }
    throw lastErr;
  }

  async function finish() {
    if (!CASE_IDS.length) {
      alert('题目还没有加载出来，请等待加载完成后再提交。');
      return;
    }
    if (!state.readerId || !state.readerId.trim()) {
      alert('请在提交前填写读者编号。');
      document.getElementById('readerId').focus();
      return;
    }

    const incomplete = getIncompleteCases();
    if (incomplete.length > 0) {
      const shown = incomplete.slice(0, 15)
        .map(c => `  • 病例 ${c.num}（缺少：${c.missing}）`)
        .join('\n');
      const more = incomplete.length > 15 ? `\n  ...还有 ${incomplete.length - 15} 个` : '';
      alert(`⚠  还有 ${incomplete.length} 个病例未完成：\n\n${shown}${more}\n\n请完成后再提交。`);
      const target = document.getElementById(`card-${incomplete[0].caseId}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.style.transition = 'box-shadow 0.4s';
        target.style.boxShadow = '0 0 0 3px rgba(107, 155, 213, 0.6)';
        setTimeout(() => { target.style.boxShadow = ''; }, 1800);
      }
      return;
    }

    if (hasSubmitted) {
      if (!confirm('您已经提交过了，是否再次提交？')) return;
    }

    if (!confirm(
      `确认提交 ${CASE_IDS.length} 个病例？\n\n读者编号：${state.readerId}\n日期：${state.studyDate}\n\n点击确定提交。`
    )) return;

    const overlay = document.getElementById('submitOverlay');
    document.getElementById('overlayMsg').textContent = '正在提交答案…';
    overlay.classList.add('active');
    document.getElementById('submitBtn').disabled = true;

    const data = buildSubmitData();
    data.status = 'submitted';

    // 文件名带时间和随机数：每次提交都是新文件，不会覆盖任何旧文件
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
    const name = `${safeReaderName()}_${timestamp}_${randomHex(3)}.json`;
    const url = COS_SUBMIT_BASE + '/submissions/' + encodeURIComponent(name);

    try {
      await putFinal(url, JSON.stringify(data, null, 2));

      overlay.classList.remove('active');
      document.getElementById('submitBtn').disabled = false;
      hasSubmitted = true;
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      showBanner('success',
        '✓ 提交成功！您的答案已保存到云端。您现在可以关闭此页面。本地备份问卷结果已自动下载。'
      );
      downloadJSON(data);
    } catch (err) {
      console.error('提交失败:', err);
      overlay.classList.remove('active');
      document.getElementById('submitBtn').disabled = false;
      showBanner('error',
        '✗ 在线提交失败（已自动重试 3 次）。' +
        '本地备份文件已自动下载，请通过邮件或微信将 JSON 文件发送给研究员。'
      );
      downloadJSON(data);
    }
  }

  // ---------- 提示条 ----------
  function showBanner(type, message, scroll = true) {
    const banner = document.getElementById('resultBanner');
    banner.className = 'result-banner ' + type;
    banner.textContent = message;
    banner.style.display = 'block';
    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- 本地备份下载 ----------
  function downloadJSON(data) {
    if (!data) data = buildSubmitData();
    const stamp = new Date().toISOString().slice(0, 10);
    const filename = `reader_${safeReaderName()}_${stamp}.json`;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function downloadBackup() {
    downloadJSON(buildSubmitData());
    alert('备份文件已下载。');
  }

  // ---------- 图片显示 ----------
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  lightbox.innerHTML = '<img>';
  lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
  document.body.appendChild(lightbox);

  function openLightbox(src) {
    lightbox.querySelector('img').src = src;
    lightbox.classList.add('active');
  }

  const imageIndices = {};

  function renderImage(caseId, side, fileList, index) {
    const imgArea = document.getElementById('imgarea-' + caseId + '-' + side);
    const navArea = document.getElementById('viewnav-' + caseId + '-' + side);
    if (!imgArea) return;

    if (!fileList || fileList.length === 0) {
      imgArea.innerHTML = '<div class="loading-placeholder">暂无图片</div>';
      navArea.style.display = 'none';
      return;
    }

    index = Math.max(0, Math.min(index, fileList.length - 1));
    imageIndices[caseId + '-' + side] = index;

    const imgUrl = IMAGE_BASE + '/images/' + caseId + '/' + encodeURIComponent(fileList[index]);

    let img = imgArea.querySelector('img');
    if (!img) {
      imgArea.innerHTML = '';
      img = document.createElement('img');
      img.alt = '病例图片';
      img.loading = 'lazy';
      img.onclick = function() { openLightbox(this.src); };
      imgArea.appendChild(img);
    }
    img.src = imgUrl;

    const total = fileList.length;
    navArea.style.display = '';
    navArea.innerHTML = `
      <button onclick="navImage('${caseId}','${side}',-1)" ${index === 0 ? 'disabled' : ''}>◀</button>
      <input type="number" min="1" max="${total}" value="${index + 1}"
        onchange="jumpImage('${caseId}','${side}',this.value)"
        onkeydown="if(event.key==='Enter') jumpImage('${caseId}','${side}',this.value)">
      <span>/ ${total}</span>
      <button onclick="navImage('${caseId}','${side}',1)" ${index === total - 1 ? 'disabled' : ''}>▶</button>`;
  }

  function navImage(caseId, side, direction) {
    const fileList = window._imageMap[caseId];
    if (!fileList) return;
    const idx = (imageIndices[caseId + '-' + side] || 0) + direction;
    renderImage(caseId, side, fileList, idx);
  }

  function jumpImage(caseId, side, value) {
    const fileList = window._imageMap[caseId];
    if (!fileList) return;
    const idx = parseInt(value) - 1;
    if (isNaN(idx)) return;
    renderImage(caseId, side, fileList, idx);
  }

  // ---------- 离开页面前提醒 ----------
  window.addEventListener('beforeunload', function (e) {
    if (hasSubmitted) return;
    const hasAnyAnswer = Object.values(state.answers).some(a => a && (a.diagnosis || a.confidence));
    if (hasAnyAnswer) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  // 同一次浏览器会话内解锁过一次，就不用重复输入
  try {
    if (sessionStorage.getItem('reader_study_unlocked') === '1') unlockUI();
  } catch (e) {}
</script>
